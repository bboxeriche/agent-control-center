name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      AGENT_CONTROL_AUTH_TOKEN: ""
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_AUTH_TOKEN: ""
      ANTHROPIC_BASE_URL: ""
      OPENAI_BASE_URL: ""
      WORKBUDDY_HTTP_URL: ""
      WORKBUDDY_HTTP_TOKEN: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run check

      - name: Run tests
        run: npm test
